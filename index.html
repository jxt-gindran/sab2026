<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sepeda Amal Borneo 2026</title>
  <meta name="description" content="A 680km charity cycling expedition across Borneo funding life-saving paediatric surgeries and immune deficiency treatment. Organized by MMA Foundation." />
  
  <!-- Default Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sab2026.com" />
  <meta property="og:title" content="Sepeda Amal Borneo 2026" />
  <meta property="og:description" content="A 680km charity cycling expedition across Borneo funding life-saving paediatric surgeries and immune deficiency treatment. Organized by MMA Foundation." />
  <meta property="og:image" content="https://sab2026.com/assets/images/sabcyclist.jpg" />
  
  <!-- Default Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://sab2026.com" />
  <meta property="twitter:title" content="Sepeda Amal Borneo 2026" />
  <meta property="twitter:description" content="A 680km charity cycling expedition across Borneo funding life-saving paediatric surgeries and immune deficiency treatment." />
  <meta property="twitter:image" content="https://sab2026.com/assets/images/sabcyclist.jpg" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#013254',  // Deep Space Blue: Primary Anchor
              cyan: '#0cdfed',  // Electric Aqua: Brand Identity
              orange: '#FF7F32', // Vitality Orange: CTA
              slate: '#5d6270', // Body Text: Slate
              pale: '#c1d2df',  // Section Shading: Pale Blue Grey
              grey: '#94a9bb',  // Card Border: Cool Grey
              // Keeping legacy/utility mappings for compatibility
              coral: '#FF7F32', // Mapping old coral to new Orange
            }
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            ride: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(32rem)' }
            }
          },
          animation: {
            shimmer: 'shimmer 2s infinite linear',
            ride: 'ride 8s ease-in-out infinite'
          },
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
            heading: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/assets/logos/SABFavicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #FFFFFF;
      /* Clinical White */
      color: #5d6270;
      /* Body Slate */
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Montserrat', sans-serif;
      color: #013254;
      /* Deep Space Blue */
    }

    /* Custom Animations */
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.6s ease-out forwards;
    }

    @keyframes scale-in {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-scale-in {
      animation: scale-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Scrollbar Hiding Utility */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Task 1: Thematic Patterns */
    .bg-tire-tread {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(148, 169, 187, 0.3) 5px, rgba(148, 169, 187, 0.3) 10px);
    }

    .bg-chain-fill {
      background-image: radial-gradient(circle closest-side, currentColor 40%, transparent 42%),
        radial-gradient(circle closest-side, currentColor 40%, transparent 42%);
      background-position: 0 0, 50% 0;
      background-size: 12px 100%;
      background-repeat: space no-repeat;
    }

    /* Utility for Chain Links */
    .chain-link-dots {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .chain-link-dots::before,
    .chain-link-dots::after {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: currentColor;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
